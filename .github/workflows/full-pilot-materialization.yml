name: full-pilot-materialization

on:
  pull_request:
    paths:
      - generator/materialize.py
      - generator/reference_schedulers.py
      - generator/network.py
      - generator/schedule.py
      - generator/instance.py
      - generator/cli.py
      - validation/materialization.py
      - validation/base_instance.py
      - validation/calibration.py
      - validation/cli.py
      - schemas/base-ifc-instance.schema.json
      - schemas/pilot-materialization.schema.json
      - schemas/qos-instance.schema.json
      - config/benchmark-v1.yaml
      - manifests/pilot-selection-v1.json
      - manifests/source-workflows-v1.json
      - source_workflows/**
      - .github/workflows/full-pilot-materialization.yml

concurrency:
  group: full-pilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact generator head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install generator
        run: python -m pip install -e '.[test]'
      - name: Check development and holdout base isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from generator.config import load_config
          from generator.materialize import selected_base_instance_id

          config = load_config(Path('config/benchmark-v1.yaml'))
          selection = json.loads(
              Path('manifests/pilot-selection-v1.json').read_text(encoding='utf-8')
          )
          development = set()
          holdout = set()
          for entry in selection['entries']:
              base_id = selected_base_instance_id(entry, config)
              if entry['split'] == 'development':
                  development.add(base_id)
              elif entry['split'] == 'holdout':
                  holdout.add(base_id)
              else:
                  raise SystemExit(f"unknown split: {entry['split']!r}")
          overlap = sorted(development & holdout)
          print(json.dumps({
              'development_base_count': len(development),
              'holdout_base_count': len(holdout),
              'cross_split_base_overlap_count': len(overlap),
          }, sort_keys=True))
          if overlap:
              raise SystemExit(
                  'holdout isolation failed: development and holdout share base realizations'
              )
          PY
      - name: Materialize exact frozen 200-input pilot
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/materialization-time.txt" \
            python -m generator.cli materialize-pilot \
              --config config/benchmark-v1.yaml \
              --source-manifest manifests/source-workflows-v1.json \
              --pilot-selection manifests/pilot-selection-v1.json \
              --source-root source_workflows \
              --output-root "$RUNNER_TEMP/pilot" \
              --manifest "$RUNNER_TEMP/pilot-materialization-v1.json" \
              --generator-commit-sha "${{ github.event.pull_request.head.sha }}"
      - name: Fully validate generated pilot
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/validation-time.txt" \
            python -m validation.cli pilot-materialization \
              --manifest "$RUNNER_TEMP/pilot-materialization-v1.json" \
              --dataset-root "$RUNNER_TEMP/pilot" \
              --config config/benchmark-v1.yaml \
              --source-manifest manifests/source-workflows-v1.json \
              --pilot-selection manifests/pilot-selection-v1.json \
              --source-root source_workflows
      - name: Report pilot counts, size, degeneracy, and resources
        run: |
          echo '--- materialization resources ---'
          cat "$RUNNER_TEMP/materialization-time.txt"
          echo '--- validation resources ---'
          cat "$RUNNER_TEMP/validation-time.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          pilot = root / 'pilot'
          manifest_path = root / 'pilot-materialization-v1.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          deadline_degenerate = 0
          budget_degenerate = 0
          time_gaps = []
          budget_widths = []
          development_bases = set()
          holdout_bases = set()
          for entry in manifest['entries']:
              instance = json.loads((pilot / entry['path']).read_text(encoding='utf-8'))
              deadline = instance['deadline']
              budget = instance['budget']
              deadline_degenerate += int(deadline['deadline_range_degenerate'])
              budget_degenerate += int(budget['budget_range_degenerate'])
              time_gaps.append(deadline['time_gap_us'])
              budget_widths.append(budget['cost_fast_ncu'] - budget['cost_floor_ref_ncu'])
              if entry['split'] == 'development':
                  development_bases.add(entry['base_instance_id'])
              else:
                  holdout_bases.add(entry['base_instance_id'])

          overlap = development_bases & holdout_bases
          raw_bytes = sum(path.stat().st_size for path in pilot.rglob('*') if path.is_file())
          raw_bytes += manifest_path.stat().st_size
          print(json.dumps({
              'base_instance_count': manifest['base_instance_count'],
              'calibration_count': manifest['calibration_count'],
              'instance_count': manifest['instance_count'],
              'split_counts': manifest['split_counts'],
              'development_base_count': len(development_bases),
              'holdout_base_count': len(holdout_bases),
              'cross_split_base_overlap_count': len(overlap),
              'deadline_degenerate_count': deadline_degenerate,
              'budget_degenerate_count': budget_degenerate,
              'min_time_gap_us': min(time_gaps),
              'max_time_gap_us': max(time_gaps),
              'min_budget_width_ncu': min(budget_widths),
              'max_budget_width_ncu': max(budget_widths),
              'raw_payload_bytes': raw_bytes,
              'file_count': sum(1 for path in pilot.rglob('*') if path.is_file()) + 1,
          }, sort_keys=True))
          PY
          tar -czf "$RUNNER_TEMP/pilot-materialization-v1.tar.gz" \
            -C "$RUNNER_TEMP" pilot pilot-materialization-v1.json
          echo "compressed_payload_bytes=$(stat -c %s "$RUNNER_TEMP/pilot-materialization-v1.tar.gz")"
      - name: Upload validated pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-materialization-v1-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pilot/
            ${{ runner.temp }}/pilot-materialization-v1.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
