[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-dataset-generator"
version = "0.1.0"
description = "Deterministic generator utilities for the IFC workflow benchmark dataset"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["generator*"]
exclude = ["config*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
