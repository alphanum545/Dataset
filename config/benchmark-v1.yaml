dataset:
  name: ifc-workflow-benchmark
  version: v1-draft
  status: specification

workflows:
  families:
    - montage
    - cybershake
    - ligo
    - sipht
    - genome
  requested_task_counts: [50, 100, 200, 400, 600, 800, 1000]
  allowed_size_deviation: null  # must be decided before freeze
  reference_mips: 1000
  data_size_unit: decimal_mb

infrastructure:
  resource_semantics: serial_scheduling_slot
  concurrency_slots_per_resource: 1
  resource_scales:
    S01:
      iot: 4
      fog: 4
      cloud: 2
    S02:
      iot: 8
      fog: 8
      cloud: 4
    S03:
      iot: 16
      fog: 16
      cloud: 8
  class_allocation:
    guarantee_each_class_when_tier_count_at_least: 3
    two_resource_tier_classes:
      - economy
      - performance
    remaining_slots: seeded_sampling
  resource_classes:
    iot:
      economy:
        mips: 500
        memory_mb: 512
        active_power_mw: 3500
        idle_power_mw: 2100
        price_ncu_per_second: 0
      balanced:
        mips: 750
        memory_mb: 1024
        active_power_mw: 5000
        idle_power_mw: 2100
        price_ncu_per_second: 25000000
      performance:
        mips: 1000
        memory_mb: 2048
        active_power_mw: 6400
        idle_power_mw: 2100
        price_ncu_per_second: 50000000
    fog:
      economy:
        mips: 1000
        memory_mb: 1024
        active_power_mw: 1000
        idle_power_mw: 50
        price_ncu_per_second: 100000000
      balanced:
        mips: 1500
        memory_mb: 2048
        active_power_mw: 3000
        idle_power_mw: 50
        price_ncu_per_second: 300000000
      performance:
        mips: 2000
        memory_mb: 4096
        active_power_mw: 5000
        idle_power_mw: 50
        price_ncu_per_second: 500000000
    cloud:
      economy:
        mips: 3000
        memory_mb: 5000
        active_power_mw: 5000
        idle_power_mw: null
        price_ncu_per_second: 600000000
      balanced:
        mips: 4000
        memory_mb: 10000
        active_power_mw: 7500
        idle_power_mw: null
        price_ncu_per_second: 800000000
      performance:
        mips: 5000
        memory_mb: 20000
        active_power_mw: 10000
        idle_power_mw: null
        price_ncu_per_second: 1000000000
  task_memory_eligibility_enforced: false

network:
  symmetric_routes: true
  bandwidth_unit: mbps_decimal
  latency_unit: microsecond
  energy_unit: picojoule_per_bit
  segments:
    iot_peer_wireless:
      bandwidth_mbps: 100
      latency_us: 2000
      energy_pj_per_bit: 110000
    iot_fog_wireless:
      bandwidth_mbps: 100
      latency_us: 5000
      energy_pj_per_bit: 162500
    fog_lan:
      bandwidth_mbps: 1000
      latency_us: 2000
      energy_pj_per_bit: 2000
    fog_cloud_backbone:
      bandwidth_mbps: 500
      latency_us: 20000
      energy_pj_per_bit: 16660
    cloud_lan:
      bandwidth_mbps: 2000
      latency_us: 1000
      energy_pj_per_bit: 2000
  routes:
    iot_iot_different: [iot_peer_wireless]
    iot_fog: [iot_fog_wireless]
    iot_cloud: [iot_fog_wireless, fog_cloud_backbone]
    fog_fog_different: [fog_lan]
    fog_cloud: [fog_cloud_backbone]
    cloud_cloud_different: [cloud_lan]
  same_resource_zero_time: true
  same_resource_zero_energy: true

scenario_profiles:
  balanced:
    compute_multiplier:
      numerator: 1
      denominator: 1
    intertier_bandwidth_multiplier:
      numerator: 1
      denominator: 1
    intertier_latency_multiplier:
      numerator: 1
      denominator: 1
    intertier_energy_multiplier:
      numerator: 1
      denominator: 1
  compute_constrained:
    fog_cloud_compute_multiplier:
      numerator: 3
      denominator: 4
    compute_rounding: floor
    network_unchanged: true
  network_constrained:
    stressed_segments:
      - iot_fog_wireless
      - fog_cloud_backbone
    bandwidth_multiplier:
      numerator: 2
      denominator: 5
    latency_multiplier:
      numerator: 5
      denominator: 2
    energy_multiplier:
      numerator: 3
      denominator: 2
    compute_unchanged: true

replications:
  seeds: [101, 202, 303]
  independent_rng_streams:
    - workflow
    - resource
    - network
    - constraint

scheduling_input:
  mode: static
  same_resource_communication_time_zero: true
  same_resource_network_energy_zero: true
  idle_energy_in_primary_compute_energy: false
  network_monetary_cost_enabled: false
  execution_time_unit: microsecond
  compute_energy_unit: nanojoule
  network_energy_unit: picojoule

cost_model:
  representation: integer
  unit: nano_normalized_cost_unit
  scale_per_normalized_cost_unit: 1000000000
  resource_price_field: price_ncu_per_second
  task_cost_rounding: ceil

reference_makespan:
  lower_bound_components:
    - optimistic_critical_path
    - aggregate_capacity
  calibration_scheduler: deterministic_heft
  deadline_factors:
    tight:
      numerator: 5
      denominator: 4
    moderate:
      numerator: 3
      denominator: 2
    relaxed:
      numerator: 2
      denominator: 1
  deadline_rounding: ceil

budget:
  enabled: true
  strategy: deadline_conditioned_feasible_cost_range
  calibration:
    frontier_scheduler: deterministic_moheft
    tradeoff_solutions: 50
    objectives:
      - makespan
      - compute_cost
    explicit_endpoints:
      - deterministic_heft
      - cheapest_resource_assignment
    deterministic_tie_breaking: true
  joint_qos_profiles:
    tight:
      deadline_level: tight
      budget_gap_fraction:
        numerator: 1
        denominator: 10
    moderate:
      deadline_level: moderate
      budget_gap_fraction:
        numerator: 1
        denominator: 2
    relaxed:
      deadline_level: relaxed
      budget_gap_fraction:
        numerator: 9
        denominator: 10
  budget_interpolation_rounding: floor
  require_known_joint_feasibility_witness: true
  intentionally_infeasible_core_instances: false
  report_degenerate_budget_ranges: true

pilot_freeze_gates:
  require_nontrivial_tier_tradeoffs: true
  require_profile_effect_validation: true
  require_scale_contention_validation: true
  require_budget_range_validation: true
  require_sensitivity_analysis: true

freeze_requirements:
  require_schema_validation: true
  require_semantic_validation: true
  require_deterministic_regeneration: true
  require_reference_schedule_validation: true
  require_joint_deadline_budget_witness_validation: true
  require_checksums: true
