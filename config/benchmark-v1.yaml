dataset:
  name: ifc-workflow-benchmark
  version: v1-draft
  status: specification

source_workflows:
  provider: pegasus
  repository: pegasus-isi/WorkflowGenerator
  implementation: bharathi
  pinned_commit: bb1f8d43fe203f5c2cb209540531998af52000ea
  immutable_after_acquisition: true
  checksum: sha256
  acquisition:
    application_argument: --application
    job_count_argument: --numjobs
    max_attempts_per_replicate: 100
    attempts_per_requested_numjobs:
      default: 2
      ligo: 5
    genome_exact_lanes: 1
    accept_only_exact_task_count: true
    accept_first_structurally_valid_matches: true
    require_distinct_replicate_checksums: true
  expected_raw_artifacts: 105

workflows:
  families:
    - montage
    - cybershake
    - ligo
    - sipht
    - genome
  requested_task_counts: [60, 100, 200, 400, 600, 800, 1000]
  task_count_policy: exact
  allowed_size_deviation: 0
  source_replicates: [r01, r02, r03]
  reference_mips: 1000
  data_size_unit: decimal_mb

infrastructure:
  resource_semantics: serial_scheduling_slot
  concurrency_slots_per_resource: 1
  resource_scales:
    S01:
      iot: 4
      fog: 4
      cloud: 2
    S02:
      iot: 8
      fog: 8
      cloud: 4
    S03:
      iot: 16
      fog: 16
      cloud: 8
  class_allocation:
    guarantee_each_class_when_tier_count_at_least: 3
    two_resource_tier_classes:
      - economy
      - performance
    remaining_slots: seeded_sampling
  resource_classes:
    iot:
      economy:
        mips: 500
        memory_mb: 512
        active_power_mw: 3500
        idle_power_mw: 2100
        price_ncu_per_second: 0
      balanced:
        mips: 750
        memory_mb: 1024
        active_power_mw: 5000
        idle_power_mw: 2100
        price_ncu_per_second: 25000000
      performance:
        mips: 1000
        memory_mb: 2048
        active_power_mw: 6400
        idle_power_mw: 2100
        price_ncu_per_second: 50000000
    fog:
      economy:
        mips: 1000
        memory_mb: 1024
        active_power_mw: 1000
        idle_power_mw: 50
        price_ncu_per_second: 100000000
      balanced:
        mips: 1500
        memory_mb: 2048
        active_power_mw: 3000
        idle_power_mw: 50
        price_ncu_per_second: 300000000
      performance:
        mips: 2000
        memory_mb: 4096
        active_power_mw: 5000
        idle_power_mw: 50
        price_ncu_per_second: 500000000
    cloud:
      economy:
        mips: 3000
        memory_mb: 5000
        active_power_mw: 5000
        idle_power_mw: null
        price_ncu_per_second: 600000000
      balanced:
        mips: 4000
        memory_mb: 10000
        active_power_mw: 7500
        idle_power_mw: null
        price_ncu_per_second: 800000000
      performance:
        mips: 5000
        memory_mb: 20000
        active_power_mw: 10000
        idle_power_mw: null
        price_ncu_per_second: 1000000000
  task_memory_eligibility_enforced: false

network:
  symmetric_routes: true
  bandwidth_unit: mbps_decimal
  latency_unit: microsecond
  energy_unit: picojoule_per_bit
  segments:
    iot_peer_wireless:
      bandwidth_mbps: 100
      latency_us: 2000
      energy_pj_per_bit: 110000
    iot_fog_wireless:
      bandwidth_mbps: 100
      latency_us: 5000
      energy_pj_per_bit: 162500
    fog_lan:
      bandwidth_mbps: 1000
      latency_us: 2000
      energy_pj_per_bit: 2000
    fog_cloud_backbone:
      bandwidth_mbps: 500
      latency_us: 20000
      energy_pj_per_bit: 16660
    cloud_lan:
      bandwidth_mbps: 2000
      latency_us: 1000
      energy_pj_per_bit: 2000
  routes:
    iot_iot_different: [iot_peer_wireless]
    iot_fog: [iot_fog_wireless]
    iot_cloud: [iot_fog_wireless, fog_cloud_backbone]
    fog_fog_different: [fog_lan]
    fog_cloud: [fog_cloud_backbone]
    cloud_cloud_different: [cloud_lan]
  same_resource_zero_time: true
  same_resource_zero_energy: true

scenario_profiles:
  balanced:
    compute_multiplier:
      numerator: 1
      denominator: 1
    intertier_bandwidth_multiplier:
      numerator: 1
      denominator: 1
    intertier_latency_multiplier:
      numerator: 1
      denominator: 1
    intertier_energy_multiplier:
      numerator: 1
      denominator: 1
  compute_constrained:
    fog_cloud_compute_multiplier:
      numerator: 3
      denominator: 4
    compute_rounding: floor
    network_unchanged: true
  network_constrained:
    stressed_segments:
      - iot_fog_wireless
      - fog_cloud_backbone
    bandwidth_multiplier:
      numerator: 2
      denominator: 5
    latency_multiplier:
      numerator: 5
      denominator: 2
    energy_multiplier:
      numerator: 3
      denominator: 2
    compute_unchanged: true

replications:
  source_to_ifc_seed:
    r01: 101
    r02: 202
    r03: 303
  benchmark_owned_rng_streams:
    - resource
    - network
    - constraint
  upstream_workflow_seed_supported: false

scheduling_input:
  mode: static
  same_resource_communication_time_zero: true
  same_resource_network_energy_zero: true
  idle_energy_in_primary_compute_energy: false
  network_monetary_cost_enabled: false
  execution_time_unit: microsecond
  compute_energy_unit: nanojoule
  network_energy_unit: picojoule

cost_model:
  representation: integer
  unit: nano_normalized_cost_unit
  scale_per_normalized_cost_unit: 1000000000
  resource_price_field: price_ncu_per_second
  task_cost_rounding: ceil

pilot_selection:
  selection_id: pilot-selection-v1
  selector_id: deterministic-stratified-pairwise
  selector_version: 1
  seed: 20260905
  candidate_universe_count: 2835
  selected_count: 200
  split_counts:
    development: 160
    holdout: 40
  marginal_targets:
    family:
      montage: 40
      cybershake: 40
      ligo: 40
      sipht: 40
      genome: 40
    target_task_count:
      60: 29
      100: 29
      200: 29
      400: 29
      600: 28
      800: 28
      1000: 28
    replicate_id:
      r01: 67
      r02: 67
      r03: 66
    resource_scale:
      S01: 67
      S02: 66
      S03: 67
    scenario_profile:
      balanced: 66
      compute_constrained: 67
      network_constrained: 67
    qos_profile:
      tight: 67
      moderate: 66
      relaxed: 67
  holdout_marginal_targets:
    family:
      montage: 8
      cybershake: 8
      ligo: 8
      sipht: 8
      genome: 8
    target_task_count:
      60: 6
      100: 5
      200: 6
      400: 5
      600: 6
      800: 6
      1000: 6
    replicate_id:
      r01: 14
      r02: 13
      r03: 13
    resource_scale:
      S01: 13
      S02: 14
      S03: 13
    scenario_profile:
      balanced: 13
      compute_constrained: 13
      network_constrained: 14
    qos_profile:
      tight: 13
      moderate: 14
      relaxed: 13

reference_makespan:
  lower_bound_components:
    - optimistic_critical_path
    - aggregate_capacity
  strategy: feasible_time_cost_envelope
  calibration_schedulers:
    time_oriented:
      - deterministic_heft_ifc
      - deterministic_peft_ifc
      - deterministic_cpop_ifc
    cost_oriented: deterministic_cost_reference_ifc
  time_anchor: minimum_validated_calibration_makespan
  economical_anchor: makespan_of_lowest_known_cost_calibration_schedule
  proposed_algorithm_excluded: true
  deadline_interpolation_fractions:
    tight:
      numerator: 1
      denominator: 10
    moderate:
      numerator: 1
      denominator: 2
    relaxed:
      numerator: 9
      denominator: 10
  deadline_rounding: ceil

budget:
  enabled: true
  strategy: deadline_conditioned_feasible_cost_range
  calibration:
    frontier_scheduler: deterministic_moheft
    tradeoff_solutions: 50
    objectives:
      - makespan
      - compute_cost
    explicit_endpoints:
      - deterministic_heft_ifc
      - deterministic_peft_ifc
      - deterministic_cpop_ifc
      - deterministic_cost_reference_ifc
    deterministic_tie_breaking: true
  joint_qos_profiles:
    tight:
      deadline_level: tight
      budget_gap_fraction:
        numerator: 1
        denominator: 10
    moderate:
      deadline_level: moderate
      budget_gap_fraction:
        numerator: 1
        denominator: 2
    relaxed:
      deadline_level: relaxed
      budget_gap_fraction:
        numerator: 9
        denominator: 10
  budget_interpolation_rounding: floor
  require_known_joint_feasibility_witness: true
  intentionally_infeasible_core_instances: false
  report_degenerate_budget_ranges: true

pilot_freeze_gates:
  require_exact_source_task_counts: true
  require_distinct_source_replicates: true
  require_nontrivial_tier_tradeoffs: true
  require_profile_effect_validation: true
  require_scale_contention_validation: true
  require_budget_range_validation: true
  require_sensitivity_analysis: true

freeze_requirements:
  require_source_manifest_validation: true
  require_schema_validation: true
  require_semantic_validation: true
  require_deterministic_regeneration: true
  require_reference_schedule_validation: true
  require_joint_deadline_budget_witness_validation: true
  require_checksums: true
